# ADOT (AWS Distro for OpenTelemetry) Collector config.
# Receives OTLP from the app over loopback and forwards logs, metrics and
# traces to Bronto's per-signal OTLP/HTTP endpoints.
#
# Env vars expected at runtime:
#   BRONTO_API_KEY        - injected from AWS Secrets Manager (ECS) / .env (local)
#   BRONTO_OTLP_BASE      - e.g. https://ingestion.eu.bronto.io  (EU) or .us. (US)
#
# Fans out to a SECOND Bronto account too (broadcast, not split) so the same
# telemetry lands in both. Leave BRONTO_API_KEY_2 / BRONTO_OTLP_BASE_2 empty
# until a second account is provisioned - the otlphttp/bronto2 exporter will
# just log export failures on its own, without affecting the first account.
#   BRONTO_API_KEY_2      - second account's ingestion key
#   BRONTO_OTLP_BASE_2    - second account's OTLP base URL

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Tag everything with where it came from so it's easy to filter in Bronto.
  resource:
    attributes:
      - key: telemetry.exporter
        value: adot-collector
        action: upsert
  # The botocore instrumentation (up to 0.64b0) still emits the deprecated
  # gen_ai.system attribute on its Bedrock spans, metrics and content events.
  # The current GenAI semconv replaced it with gen_ai.provider.name (same
  # well-known value, "aws.bedrock"). ADOT ships no transform processor, so
  # the attributes processor does the rename; `insert` is a no-op once
  # upstream emits gen_ai.provider.name itself.
  attributes/genai:
    actions:
      - key: gen_ai.provider.name
        from_attribute: gen_ai.system
        action: insert
      - key: gen_ai.system
        action: delete

exporters:
  otlphttp/bronto:
    logs_endpoint: ${env:BRONTO_OTLP_BASE}/v1/logs
    metrics_endpoint: ${env:BRONTO_OTLP_BASE}/v1/metrics
    traces_endpoint: ${env:BRONTO_OTLP_BASE}/v1/traces
    headers:
      x-bronto-api-key: ${env:BRONTO_API_KEY}
  # Second Bronto account - same signals, broadcast in parallel.
  otlphttp/bronto2:
    logs_endpoint: ${env:BRONTO_OTLP_BASE_2}/v1/logs
    metrics_endpoint: ${env:BRONTO_OTLP_BASE_2}/v1/metrics
    traces_endpoint: ${env:BRONTO_OTLP_BASE_2}/v1/traces
    headers:
      x-bronto-api-key: ${env:BRONTO_API_KEY_2}
  # Mirror to the collector's own logs for debugging export failures.
  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, attributes/genai, batch]
      exporters: [otlphttp/bronto, otlphttp/bronto2, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, attributes/genai, batch]
      exporters: [otlphttp/bronto, otlphttp/bronto2, debug]
    logs:
      receivers: [otlp]
      processors: [resource, attributes/genai, batch]
      exporters: [otlphttp/bronto, otlphttp/bronto2, debug]
